<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <title>UniFi map</title>
        <link rel="stylesheet" href="tab.css" />
    </head>
    <body>
        <div class="top">
            <div class="title">
                <div class="over" id="over">UniFi</div>
                <h1 id="h1"></h1>
            </div>
            <div class="kpi" id="kOnline"></div>
            <div class="kpi" id="kSlow"></div>
            <div class="kpi" id="kUpdates"></div>
        </div>
        <div class="banner" id="banner" role="status"></div>
        <div class="card">
            <div class="hd">
                <b id="mapTitle"></b><span id="mapHint"></span>
                <div class="legend" id="legend"></div>
            </div>
            <div class="scroll"><svg id="map" preserveAspectRatio="xMidYMid meet" role="img"></svg></div>
            <div class="detail" id="detail" role="dialog"></div>
        </div>
        <!-- socket client of admin (same origin, uses the admin login if enabled) -->
        <script src="../../lib/js/socket.io.js"></script>
        <script src="map-layout.js"></script>
        <script src="tab.js"></script>
    </body>
</html>
